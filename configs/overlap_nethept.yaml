dataset:
  name: nethept
  graph_path: data/NetHEPT.txt
  directed: true
  expected_num_nodes: 15233
  expected_num_edges: 32235

diffusion:
  model: IC
  probability: 0.01

seed:
  budget: 10

gnn:
  device: cpu
  model_dir: ../codex/GRL_最终实验_v2/models
  embedding_dim: 64
  hidden_dim: 64
  walk_length: 10
  num_walks: 10
  window: 10
  workers: 1

comparison:
  dataset_path: ../codex/GRL_最终实验_v2/marginal_dataset.json
  reuse_dataset: true

overlap_experiment:
  distance_cap: 6
  epochs: 8
  batch_size: 16
  learning_rate: 0.001
  seeds: [20260821, 20260822, 20260823, 20260824, 20260825]
  sequential_max_nodes: 200
  sequential_pool_size: 20
  sequential_budgets: [1, 3, 5, 10]
  mc_runs_sequential: 10
  mc_runs_spread: 100

experiment:
  output_dir: outputs/overlap_experiment/nethept
