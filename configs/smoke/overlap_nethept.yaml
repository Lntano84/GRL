dataset:
  name: nethept
  graph_path: data/NetHEPT.txt
  directed: true
  expected_num_nodes: 15233
  expected_num_edges: 32235

diffusion:
  model: IC
  probability: 0.01

seed:
  budget: 10

gnn:
  device: cpu
  model_dir: ../codex/GRL_最终实验_v2/models
  embedding_dim: 64
  hidden_dim: 32
  walk_length: 10
  num_walks: 10
  window: 10
  workers: 1

comparison:
  dataset_path: ../codex/GRL_最终实验_v2/marginal_dataset.json
  reuse_dataset: true

overlap_experiment:
  distance_cap: 6
  epochs: 1
  batch_size: 32
  learning_rate: 0.001
  seeds: [20260821]
  max_train_samples: 64
  sequential_max_nodes: 50
  sequential_pool_size: 10
  sequential_budgets: [1, 2]
  mc_runs_sequential: 2
  mc_runs_spread: 5

experiment:
  output_dir: outputs/overlap_experiment/smoke_nethept
