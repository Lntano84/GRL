dataset:
  name: congress_twitter
  # Congress-Twitter.  475 nodes / 13,289 weighted directed edges, <k> = 55.95.
  # This is one of the four datasets in Inf. Sci. 2026 (744) 123375 and the densest of them.
  #
  # Format note: the file is a NetworkX edge list -- ``u v {'weight': w}`` -- which
  # ``_parse_graph_file`` now understands (see ``_parse_weight``).  Before that fix it
  # raised ``ValueError: could not convert string to float: "{'weight':"``.
  #
  # Scale note: with only 475 nodes, a budget of 200 seeds covers 42% of the network.
  # That is the regime in which the overexposure objective turns genuinely non-monotone;
  # on NetHEPT the same absolute budget is 1.3%.  Always report |S| / n alongside |S|.
  graph_path: data/paper/congress/congress_network/congress.edgelist
  directed: true
  expected_num_nodes: null
  expected_num_edges: null

diffusion:
  model: IC
  probability: 0.01
  mc_runs_train: 100
  mc_runs_eval: 1000

seed:
  budget: 20

baselines:
  methods:
    - degree

experiment:
  random_seed: 20260916
  repeat: 1
  output_dir: outputs/congress_twitter
