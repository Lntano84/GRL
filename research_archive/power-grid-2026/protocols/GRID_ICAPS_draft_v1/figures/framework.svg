<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#4b5563"/></marker>
    <style>text{font-family:Arial,sans-serif;fill:#1f2937;font-size:17px} .title{font-size:25px;font-weight:bold}.small{font-size:14px}.head{font-weight:bold}.box{fill:#f5f7fa;stroke:#687485;stroke-width:1.4;rx:8}.focus{fill:#eaf1fb;stroke:#3567a4;stroke-width:1.8;rx:8}.edge{stroke:#4b5563;stroke-width:1.8;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="510" fill="white"/>
  <text x="38" y="38" class="title">Progressive topology search with substation completion</text>
  <text x="38" y="65" class="small">Public feedback only; shared base controller and caches; ranking is replaceable</text>
  <rect x="35" y="105" width="220" height="92" class="box"/>
  <text x="54" y="137" class="head">Public state + base action</text><text x="54" y="164" class="small">Current candidate library</text><text x="54" y="184" class="small">No unseen action outcomes</text>
  <rect x="290" y="105" width="220" height="92" class="box"/>
  <text x="307" y="137" class="head">Canonical legal candidates</text><text x="307" y="164" class="small">Mask disconnected endpoints</text><text x="307" y="184" class="small">Retain substation aliases</text>
  <rect x="545" y="105" width="205" height="92" class="box"/>
  <text x="563" y="137" class="head">Ranking + first 128</text><text x="563" y="164" class="small">Same author-frequency order</text><text x="563" y="184" class="small">in the policy experiment</text>
  <rect x="945" y="105" width="220" height="92" class="box"/>
  <text x="964" y="137" class="head">Verified proposal</text><text x="964" y="164" class="small">Return to continuous control</text><text x="964" y="184" class="small">and restoration</text>
  <path d="M255 151 H290" class="edge"/><path d="M510 151 H545" class="edge"/>
  <path d="M750 130 H945" class="edge"/><text x="776" y="113" class="small">Initial safe / exhausted</text>
  <rect x="545" y="272" width="205" height="102" class="focus"/>
  <text x="563" y="305" class="head">Progressive batches</text><text x="563" y="332" class="small">64 more actual simulations</text><text x="563" y="352" class="small">Update incumbent and plateau</text>
  <path d="M648 197 V272" class="edge"/><text x="666" y="240" class="small">Needs more evidence</text>
  <rect x="800" y="272" width="365" height="102" class="focus"/>
  <text x="820" y="305" class="head">Incumbent-substation completion</text><text x="820" y="332" class="small">Only on the frozen extended-stop branch</text><text x="820" y="352" class="small">Query every remaining representative at that station</text>
  <path d="M750 323 H800" class="edge"/><text x="760" y="303" class="small">Stop</text>
  <path d="M1055 272 V197" class="edge"/>
  <path d="M610 374 V412 H505 V323 H545" class="edge"/><text x="297" y="436" class="small">Continue if stop conditions are unmet; no incumbent means exhaust the pool.</text>
  <text x="38" y="470" class="small">Conditional property: completion cannot lower the best observed single-state key.</text>
  <text x="38" y="493" class="small">No global-optimality, long-term safety, or hard real-time certificate. Initial safe returns skip completion.</text>
</svg>
